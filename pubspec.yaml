name: bms_face_scan
description: "FaceCheck — แอปลงเวลาทำงาน (พนักงานติดตั้งบนมือถือตัวเอง) — login HOSxP -> ลงทะเบียนใบหน้า -> สแกนลงเวลา ผ่านตัวกลางสแกนหน้า."
publish_to: 'none'

version: 69.9.2+14

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state management / DI / routing (GetX — same stack the team already knows)
  get: ^4.7.2

  # networking to the central middleware
  http: ^1.4.0

  # settings persistence (hcode, จุดสแกน, session) + PIN hash
  shared_preferences: ^2.5.3
  crypto: ^3.0.6

  # ฟอนต์ระบบ (Noto Sans Thai + Nunito ตาม Figma) — โหลด CDN ครั้งแรกแล้ว cache
  google_fonts: ^6.2.1

  # ไอคอนทั้งแอป — Phosphor (phosphoricons.com)
  phosphor_flutter: ^2.1.0

  # กราฟในแดชบอร์ด
  fl_chart: ^1.2.0

  # camera + on-device face detection (ML Kit)
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.13.1

  # jpeg resize/compress before upload
  image: ^4.5.4

  # runtime camera permission
  permission_handler: ^12.0.1

  # keep screen awake ระหว่างสแกน
  wakelock_plus: ^1.4.0

  # liveness voice prompts (เสียงสั่ง — ก๊อปจากระบบเดิม)
  audioplayers: ^6.5.1

  # GPS ตอนลงเวลา (logic ระบบเก่า — เก็บพิกัดที่สแกน)
  geolocator: ^14.0.2
  battery_plus: ^7.0.0
  screen_brightness: ^2.1.11
  # ชื่อ wifi ใน chip "พร้อม" (แตะกางดู) — best-effort
  network_info_plus: ^6.1.4

  # เลข version แอป (โชว์หน้า login/home) — อ่านจาก pubspec ตอน runtime
  package_info_plus: ^9.0.1

# screen_brightness_ios 2.1.3+ ใช้ FlutterSceneLifeCycleDelegate (UIScene) ซึ่งต้องการ
# Flutter ใหม่กว่าที่เครื่อง build ใช้ — pin ไว้ที่ 2.1.2 จนกว่าจะอัป Flutter ทั้งสองฝั่ง
dependency_overrides:
  screen_brightness_ios: 2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # gen app icon ทุกขนาดจาก assets/images/logo.png (iOS + Android)
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true # icon iOS ห้ามมี alpha

flutter:
  uses-material-design: true
  assets:
    - assets/audios/
    - assets/images/
