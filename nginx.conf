server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA — path ที่ไม่ใช่ไฟล์จริง คืน index.html (รวม /hospital-request)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # static assets cache ยาว (ชื่อไฟล์มี hash อยู่แล้ว)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
